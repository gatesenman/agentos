<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentOS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () { var m = 'system'; try { m = localStorage.getItem('agentos.theme') || 'system'; } catch (e) {}
    if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var d = document.documentElement; d.setAttribute('data-theme', m);
    // ?mica=1 opts into translucent (acrylic) surfaces; default is fully opaque.
    if (/[?&]mica=1\b/.test(location.search)) d.classList.add('mica'); })();
</script>
<style>html{background:#f3f3f3;color-scheme:light}html[data-theme=dark]{background:#202020;color-scheme:dark}</style>
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/components/ui.js">
<link rel="modulepreload" href="js/pages/envs.js">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>AgentOS requires JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
